name: Bug 报告
description: 记录可复现的软件或数据管线问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供命令、合成配置和最小复现；不要上传 Wind 数据。
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: 使用配置
      placeholder: Code/config.json 或参数摘要
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 数据安全
      options:
        - label: 本 Issue 不包含真实 Wind 数据、凭据或本机绝对路径
          required: true
